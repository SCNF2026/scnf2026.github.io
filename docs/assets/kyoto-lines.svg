<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8f7f1"/>
      <stop offset="1" stop-color="#e9f1f1"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="0.7" y2="1">
      <stop stop-color="#dec29a"/>
      <stop offset="1" stop-color="#efdfc5"/>
    </linearGradient>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="250" y1="75" x2="355" y2="277">
      <stop stop-color="#253f48"/>
      <stop offset="1" stop-color="#3d6370"/>
    </linearGradient>
  </defs>
  <!-- Original decorative Kyoto motif, not a literal view of a particular temple. -->
  <rect width="640" height="320" rx="22" fill="url(#paper)"/>
  <circle cx="366" cy="137" r="88" fill="url(#light)"/>

  <!-- Pale wall panels and sparse columns keep the slender tower legible. -->
  <path d="M287 107h38v23h-38zM283 143h46v24h-46zM278 179h56v25h-56zM273 215h66v27h-66zM267 251h78v25h-78z" fill="#e5e8de"/>
  <g fill="none" stroke="#38545e" stroke-width="3.5">
    <path d="M287 107v23m19-23v18m19-18v23M283 143v24m23-24v18m23-18v24M278 179v25m28-25v19m28-19v25M273 215v27m33-27v20m33-20v27M267 251v25m19-25v25m40-25v25m19-25v25"/>
  </g>
  <g fill="url(#ink)">
    <path d="M256 103c17 0 29-7 42-20h16c13 13 25 20 42 20l-7 7c-23 4-63 4-86 0Z"/>
    <path d="M249 139c19 1 34-6 48-20h18c14 14 29 21 48 20l-8 7c-26 4-72 4-98 0Z"/>
    <path d="M240 175c23 2 39-6 55-20h22c16 14 32 22 55 20l-9 7c-30 4-84 4-114 0Z"/>
    <path d="M231 211c27 2 45-6 62-20h26c17 14 35 22 62 20l-10 7c-34 5-96 5-130 0Z"/>
    <path d="M221 247c31 3 52-6 70-20h30c18 14 39 23 70 20l-11 7c-39 5-109 5-148 0Z"/>
    <path d="M298 256h16v20h-16zM260 275h92v4h-92z"/>
  </g>
  <!-- One shared ink gradient avoids a separate band of shading on every roof. -->
  <g fill="none" stroke="#253f48" stroke-linecap="round">
    <path d="M306 44v39" stroke-width="2.4"/>
    <path d="M303 54h6m-7 6h8m-9 6h10m-11 6h12" stroke-width="1.8"/>
  </g>
  <circle cx="306" cy="43" r="2.8" fill="#253f48"/>

</svg>
